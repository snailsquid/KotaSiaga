# Deploy stack: microservice containers only (AGENTS.md section 2.6 and section 9).
# Used as-is by Coolify on volta and by `docker compose` on an STB. Images are built by CI
# and pulled here; there are no `build:` keys so the deploy host never compiles Rust.
# Local build: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
name: kotasiaga

services:
  core-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/snailsquid}/kotasiaga-core:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/core.db
    volumes: [core-data:/data]
    mem_limit: 256m
    cpus: 0.5

  identity-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/snailsquid}/kotasiaga-identity:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8081"
      DATABASE_PATH: /data/identity.db
    volumes: [identity-data:/data]
    mem_limit: 64m
    cpus: 0.25

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [core-service, identity-service]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    # Loopback only. On volta a host-network cloudflared routes the hostname here (GATEWAY_PORT=18080,
    # since 8080 is Traefik's). On an STB the `tunnel` service reaches the gateway over the compose network.
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:80"]
    mem_limit: 64m
    cpus: 0.25

  # Only with COMPOSE_PROFILES=tunnel (STB). volta uses its existing host cloudflared instead.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [gateway]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    mem_limit: 64m
    cpus: 0.25

volumes:
  core-data:
  identity-data:
