# KotaSiaga gateway: routing + rate limit. Public base: https://<name>.stei.site/api
worker_processes 1;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 1m;

  # Behind the Cloudflare tunnel every request arrives from the tunnel container,
  # so take the real client IP from Cloudflare's header before rate limiting.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
  limit_req_status 429;

  upstream core     { server core-service:8080;     keepalive 32; }
  upstream identity { server identity-service:8081; keepalive 8; }

  server {
    listen 80;
    default_type application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 15s;

    error_page 429 = @rate_limited;
    location @rate_limited {
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"rate_limited","message":"Terlalu banyak permintaan, coba lagi sebentar","request_id":"$request_id"}}';
    }

    location = /api/health { proxy_pass http://core; }

    location /api/auth/ {
      limit_req zone=per_ip burst=10 nodelay;
      proxy_pass http://identity;
    }

    location /api/ {
      limit_req zone=per_ip burst=40 nodelay;
      proxy_pass http://core;
    }

    location / {
      return 404 '{"error":{"code":"not_found","message":"Endpoint tidak ditemukan","request_id":"$request_id"}}';
    }
  }
}
