# STB stack: microservice containers only (AGENTS.md section 2.6 and section 9).
# Images are built by CI and pulled here; `build:` is for local use on a non-STB machine.
name: kotasiaga

services:
  core-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER}/kotasiaga-core:${IMAGE_TAG:-latest}
    build: { context: ., args: { SERVICE: core-service } }
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/core.db
    volumes: [core-data:/data]
    mem_limit: 256m
    cpus: 0.5

  identity-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER}/kotasiaga-identity:${IMAGE_TAG:-latest}
    build: { context: ., args: { SERVICE: identity-service } }
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8081"
      DATABASE_PATH: /data/identity.db
    volumes: [identity-data:/data]
    mem_limit: 64m
    cpus: 0.25

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [core-service, identity-service]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    # Local debugging only; the tunnel reaches the gateway over the compose network.
    ports: ["127.0.0.1:8080:80"]
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [gateway]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    mem_limit: 64m
    cpus: 0.25

volumes:
  core-data:
  identity-data:
