[package]
name = "auth-token"
version = "0.1.0"
edition = "2024"
description = "HS256 user access tokens shared by identity-service (issues) and core-service (verifies)."

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
