# KotaSiaga gateway: routing, rate limit and API docs.
# Public base: https://kotasiaga.arkk.dev/api (planned: https://kotasiaga.stei.site/api, K02)
worker_processes 1;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 1m;

  # Behind the Cloudflare tunnel (or Traefik) every request arrives from a proxy container, so
  # the real client IP comes from Cloudflare's header, but only when the peer is on one of the
  # gateway's own Docker networks (generated at start by 40-trusted-proxies.sh), not from any
  # private address. Whoever can reach that proxy without Cloudflare can still set the header:
  # the proxy must only accept traffic from the tunnel (see README, Deploy).
  include /etc/nginx/trusted_proxies.conf;
  real_ip_header CF-Connecting-IP;

  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
  # Login and register: slower, against password guessing.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  limit_req_status 429;

  # Re-resolve service names (Docker DNS) so a recreated container's new IP is picked up without
  # restarting the gateway; otherwise a redeploy of one service leaves the gateway on 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream core     { zone core 64k;     server core-service:8080 resolve;     keepalive 32; }
  upstream identity { zone identity 64k; server identity-service:8081 resolve; keepalive 8; }

  server {
    listen 80;
    default_type application/json;
    # Relative redirects keep the client's host and port (e.g. localhost:8080).
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 15s;

    error_page 429 = @rate_limited;
    location @rate_limited {
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"rate_limited","message":"Terlalu banyak permintaan, coba lagi sebentar","request_id":"$request_id"}}';
    }

    # A service that is down or restarting: same JSON error envelope as the services use.
    error_page 502 504 = @upstream_down;
    location @upstream_down {
      add_header Retry-After 5 always;
      return 503 '{"error":{"code":"upstream_unavailable","message":"Layanan sedang dimulai ulang, coba lagi sebentar","request_id":"$request_id"}}';
    }

    location = /api/health { proxy_pass http://core; }

    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://identity;
    }

    # API docs: Swagger UI and the raw OpenAPI contract (static files baked into the image).
    location = /api/docs { return 301 /api/docs/; }
    location /api/docs/ {
      limit_req zone=per_ip burst=40 nodelay;
      alias /usr/share/nginx/html/docs/;
      index index.html;
      types { text/html html; }
      add_header Cache-Control "no-cache" always;
    }
    location = /api/openapi.yaml {
      limit_req zone=per_ip burst=40 nodelay;
      alias /usr/share/nginx/html/docs/openapi.yaml;
      types { } default_type application/yaml;
      add_header Cache-Control "no-cache" always;
    }

    location /api/ {
      limit_req zone=per_ip burst=40 nodelay;
      proxy_pass http://core;
    }

    location / {
      return 404 '{"error":{"code":"not_found","message":"Endpoint tidak ditemukan","request_id":"$request_id"}}';
    }
  }
}
