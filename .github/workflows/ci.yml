name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: npx -y @redocly/cli@1.34.5 lint openapi.yaml

  # Multi-arch images: one tag per service holding linux/amd64 and linux/arm64.
  # Each arch builds natively on its own runner (no QEMU; emulated Rust builds are very slow),
  # then `merge` joins the two digests under one tag. Docker pulls the right one per machine.
  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [core-service, identity-service]
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          short="${{ matrix.service }}"; short="${short%-service}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kotasiaga-${short}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: SERVICE=${{ matrix.service }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.service }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: image
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [core-service, identity-service]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          short="${{ matrix.service }}"; short="${short%-service}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kotasiaga-${short}"
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:${GITHUB_SHA}" \
            $(for f in /tmp/digests/*; do echo "$image@$(cat "$f")"; done)
          docker buildx imagetools inspect "$image:latest"
