[package]
name = "partner-contracts"
version = "0.1.0"
edition = "2024"
description = "Partner API contracts (JelajahLokal, DonorKita): parsers, real-shape mocks and sample payloads. Shared by core-service and integration-service."

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
