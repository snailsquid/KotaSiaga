name: ci

# Runs on Gitea Actions on volta (Gitea pull-mirrors this repo and reads .github/workflows).
# Kept compatible with GitHub Actions. The Gitea mirror has no pull requests, so `test` runs on
# every pushed branch; images and deploy run only on master.
on:
  push:
  pull_request:

env:
  # Images live in GHCR under the GitHub owner, whichever CI pushes them.
  IMAGE_REGISTRY: ghcr.io/snailsquid

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: npx -y @redocly/cli@1.34.5 lint openapi.yaml

  # linux/amd64 only: volta is x86 and there is no arm runner on Gitea.
  # arm64 (for an ARM STB) comes back with GitHub Actions: add a linux/arm64 leg on
  # ubuntu-24.04-arm and merge both digests under one tag with `docker buildx imagetools create`.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-service, identity-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Gitea's built-in token cannot push to GHCR: GHCR_TOKEN is a classic PAT with write:packages.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: snailsquid
          password: ${{ secrets.GHCR_TOKEN }}
      - id: name
        run: |
          short="${{ matrix.service }}"; short="${short%-service}"
          echo "image=${IMAGE_REGISTRY}/kotasiaga-${short}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.name.outputs.image }}:buildcache,mode=max

  # CD: ask Coolify on volta to redeploy the compose stack, which pulls the images pushed above.
  # Runs on the runner on volta (label `volta`), since Coolify is private there. Reads repo secrets
  # COOLIFY_URL, COOLIFY_RESOURCE_UUID and COOLIFY_TOKEN; skips with a warning while any is unset.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: image
    runs-on: volta
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_RESOURCE_UUID" ]; then
            echo "::warning::Coolify secrets not set; skipping deploy"
            exit 0
          fi
          curl --fail-with-body -sS --max-time 30 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false"
